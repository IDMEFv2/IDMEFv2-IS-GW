spring.application.name=${GATEWAY_DOMAIN:s4s-gateway}

gatewayRole=${GATEWAY_ROLE:sender}
kafkaDomainLocal= ${KAFKA_LOCAL_DOMAIN:rest-proxy}
kafkaPortLocal= ${KAFKA_LOCAL_PORT:8082}
kafkaTopic= ${KAFKA_TOPIC:my_processed}

gatewayDomainRC= ${GATEWAY_RECEIVER_DOMAIN:gateway-receiver}
gatewayPortRC= ${GATEWAY_RECEIVER_PORT:10081}

gatewayReceiverURL= ${GATEWAY_RECEIVER_URL:''}
gatewayReceiverUsername= ${GATEWAY_RECEIVER_USERNAME:''}
gatewayReceiverPassword= ${GATEWAY_RECEIVER_PASSWORD:''}

gatewayDomainSD= ${GATEWAY_SENDER_DOMAIN:gateway-sender}
gatewayPortSD= 10081

server.port= 10081
gatewayProtocol=${GATEWAY_PROTOCOL:http}
server.ssl.enabled= ${SSL_INBOUND_ACTIVATED:false}
server.ssl.key-store= ${SSL_KEY_STORE:/store/keystore.p12}
server.ssl.key-store-password= ${SSL_KEY_STORE_PASSWORD:password}
server.ssl.key-store-type= PKCS12
server.ssl.key-alias= 1

server.ssl.trust-store= ${SSL_TRUST_STORE:/store/truststore.p12}
server.ssl.trust-store-password= ${SSL_TRUST_STORE_PASSWORD:password}
server.ssl.trust-store-type= PKCS12

#Values for internal SSL Context of Java, not VM
sslOutboundActivated=${SSL_OUTBOUND_ACTIVATED}
trustStorePassword= ${SSL_TRUST_STORE_PASSWORD}
trustStorePath= ${SSL_TRUST_STORE:/store/truststore.p12}
#Activate for mTLS
server.ssl.client-auth= ${SSL_MTLS_SETTING:want}
keyStorePath= ${SSL_KEY_STORE:/store/keystore.p12}
keyStorePassword= ${SSL_KEY_STORE_PASSWORD}

relevantHeaders={'content-type','accept','user-Agent','accept-Encoding','safe4soc-receiver-hostname','safe4soc-receiver-port'}
isaConfig=\
{\
  "provider_reason": "compliance",\
  "intended_use": "alert_gathering",\
  "data_usage_policies": {\
    "use_until": "2024-12-12",\
    "use_after": "2024-09-12",\
    "share_further": false\
  },\
  "data_sender_SIEM_brand": "Example Company A",\
  "data_sender_SIEM_version": "Version 0.1",\
  "IDMEFv2_attributes": {\
    "attributes_to_transmit": [],\
    "attributes_to_neglect": [],\
    "attributes_to_anonymize": [],\
    "attributes_to_pseudonemize": []\
  },\
  "sending_mode": "",\
  "encryption_requirements": [],\
  "authentication_requirements": [],\
  "connection_requirements": [],\
  "filterConfig": {\
    "CreateTime": "",\
    "StartTime": "",\
    "Cause": ""\
  },\
  "enrichmentConfig": {\
    "CreateTime": "",\
    "StartTime": ""\
  }\
}


### Logging Configuration
# Set logging level for the root logger
logging.level.root=INFO
logging.level.de.fraunhofer.aisec.s4sgateway=INFO
# Set logging level for a specific package or class
#logging.level.com.example.loggingdemo=DEBUG
# Set the logging pattern
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level - %msg%n

# Set CONDITIONS EVALUATION REPORT on (DEBUG) or off (INFO)
logging.level.org.springframework.boot.autoconfigure=INFO

# Enable logging to a file
logging.file.name=logs/spring-boot-app.log
# Maximum file size before rolling over
logging.file.max-size=10MB
# Total size of all log files
logging.file.total-size-cap=50MB